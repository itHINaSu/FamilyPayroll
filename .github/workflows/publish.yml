name: Publish container image

# Builds and pushes to GitHub Container Registry so `docker compose up -d` can
# pull a ready-made image instead of building from source on the target machine.
#
# Works while the repository is private. The published package inherits that
# privacy, so the server pulling it needs a `docker login ghcr.io` with a token
# carrying `read:packages`. Making the repository public later only removes that
# requirement — nothing about the image or the compose file changes.
#
# Multi-arch: amd64 for a NAS or mini PC, arm64 for a Raspberry Pi or Apple
# silicon. better-sqlite3 and sharp ship prebuilds for both, so neither needs a
# compiler at runtime.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase path, which the repository name is not.
  IMAGE_NAME: ${{ github.repository_owner }}/familypayroll

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            # Until this lands on the default branch, `:edge` is the tag to pull.
            type=raw,value=edge,enable=${{ github.ref_name != github.event.repository.default_branch }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, so a rebuild after a small change does
          # not reinstall node_modules from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max
