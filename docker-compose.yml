# Family Payroll
#
#   docker compose up -d
#
# That is the whole install. Secrets generate themselves on first boot and
# persist in ./data, so there is nothing to configure before starting — you
# create the household and your parent account in the browser.
#
# To run from GitHub without cloning, replace the `build` block below with:
#
#   build: https://github.com/<you>/FamilyPayroll.git#main
#
# and `docker compose build --pull` will fetch the latest source each time.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: family-payroll:latest
    container_name: family-payroll
    restart: unless-stopped

    environment:
      # Ownership of ./data on the host. `id -u` and `id -g` give you these.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      # Load-bearing, not cosmetic: pay periods, payroll cutoffs, and bill due
      # dates are calendar arithmetic. A wrong clock silently shifts paydays.
      TZ: ${TZ:-America/Chicago}

      # Your public HTTPS origin. Required before Web Push works on iOS, and
      # changing it later invalidates every push subscription.
      APP_URL: ${APP_URL:-}

      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}

    ports:
      - "${PORT:-3000}:3000"

    volumes:
      # One directory holds everything: the database, the WAL, and the nightly
      # snapshots. Back this up and you have backed up the entire system.
      - ./data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
