# Family Payroll
#
#   docker compose up -d
#
# That is the whole install. Secrets generate themselves on first boot and
# persist in ./data, so there is nothing to configure before starting — you
# create the household and your parent account in the browser.
#
# ---------------------------------------------------------------------------
# Where the image comes from
#
# By default this PULLS a prebuilt image published by the GitHub Action in
# .github/workflows/publish.yml. Nothing needs to be cloned on the server.
#
# If a pull is denied: GHCR package visibility does NOT follow the repository's,
# so a public repo can still have a private package. Change it under
# your profile > Packages > familypayroll > Package settings > Change visibility.
#
# To BUILD FROM SOURCE instead, comment out `image:` and uncomment one `build:`.
# ---------------------------------------------------------------------------

services:
  app:
    image: ${IMAGE:-ghcr.io/ithinasu/familypayroll:latest}

    # Build from a local clone:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    # Or build straight from GitHub without cloning:
    # build: https://github.com/itHINaSu/FamilyPayroll.git#main

    container_name: family-payroll
    restart: unless-stopped

    environment:
      # Ownership of ./data on the host. `id -u` and `id -g` give you these.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}

      # Load-bearing, not cosmetic: pay periods, payroll cutoffs, and bill due
      # dates are calendar arithmetic. A wrong clock silently shifts paydays.
      TZ: ${TZ:-America/Chicago}

      # Your public HTTPS origin. Required before Web Push works on iOS, and
      # changing it later invalidates every push subscription.
      APP_URL: ${APP_URL:-}

      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}

    ports:
      - "${PORT:-3000}:3000"

    volumes:
      # One directory holds everything: the database, the WAL, and the nightly
      # snapshots. Back this up and you have backed up the entire system.
      - ./data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
